name: Lineage validation

on:
  push:
    branches:
      - refactor/lineage-dependency-graph
  pull_request:
    branches:
      - main

jobs:
  lineage-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run lineage regression tests
        run: node tests/lineage.test.js
